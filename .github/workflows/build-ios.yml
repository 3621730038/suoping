name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: unzip -q ios-project.zip

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate
        run: cd ios && xcodegen generate

      - name: Build
        run: cd ios && xcodebuild -project PrivacyConsole.xcodeproj -scheme PrivacyConsole -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_ENTITLEMENTS=""

      - name: Package
        run: cd ios && mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/PrivacyConsole.app Payload/ && zip -r PrivacyConsole-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyConsole-unsigned-ipa
          path: ios/PrivacyConsole-unsigned.ipa
